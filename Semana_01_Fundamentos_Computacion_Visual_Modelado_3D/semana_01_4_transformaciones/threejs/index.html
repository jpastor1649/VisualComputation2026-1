<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js + React Three Fiber - Transformaciones 3D</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 10;
        max-width: 300px;
      }
      .info h2 {
        margin-bottom: 10px;
        color: #4da6ff;
      }
      .info p {
        margin: 5px 0;
        line-height: 1.4;
      }
      .controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 10;
      }
      .controls h3 {
        margin-bottom: 8px;
        color: #4da6ff;
      }
      .controls p {
        margin: 3px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="info">
      <h2>Transformaciones 3D</h2>
      <p><strong>Animaciones aplicadas:</strong></p>
      <p>✓ Traslación circular</p>
      <p>✓ Rotación continua</p>
      <p>✓ Escalado sinusoidal</p>
    </div>
    <div class="controls">
      <h3>Controles:</h3>
      <p>🖱️ Clic izq + Drag: Rotar vista</p>
      <p>🖱️ Rueda: Zoom</p>
      <p>🖱️ Clic der + Drag: Pan</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
